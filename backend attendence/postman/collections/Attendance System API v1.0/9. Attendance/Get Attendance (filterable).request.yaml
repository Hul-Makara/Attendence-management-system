$kind: http-request
url: "{{baseUrl}}/attendance"
method: GET
queryParams:
  - key: studentId
    value: "{{studentId}}"
    disabled: true
  - key: date
    value: 2026-11-11
    disabled: true
  - key: status
    value: present
    disabled: true
  - key: classGroup
    value: "{{classGroupId}}"
    disabled: true
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.success && res.data && res.data.length) pm.collectionVariables.set('attendanceId', res.data[0]._id);
    language: text/javascript
order: 1000
