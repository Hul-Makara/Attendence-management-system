$kind: http-request
url: "{{baseUrl}}/leave-requests"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.success && res.data && res.data.length) pm.collectionVariables.set('leaveId', res.data[0]._id);
    language: text/javascript
order: 1000
